name: Deploy Task1

on:
  push:
    branches:
      - main
    paths:
      - 'task1/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Create deployment structure
        run: |
          mkdir -p deploy
          if [ -f "index.html" ]; then cp index.html deploy/; fi
          if [ -d "task1" ]; then cp -r task1 deploy/; fi
          if [ -d "task2_NoteApp/dist" ]; then cp -r task2_NoteApp/dist deploy/task2_NoteApp; fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

